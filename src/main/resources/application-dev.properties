# Perfil DEV: base de datos H2 guardada en archivo

# La base se guardará en la carpeta datos del proyecto
spring.datasource.url=jdbc:h2:file:./datos/reportes

# Driver de H2
spring.datasource.driver-class-name=org.h2.Driver

# Usuario y contraseña de H2
spring.datasource.username=sa
spring.datasource.password=

# Crea las tablas si no existen y conserva los datos existentes
spring.jpa.hibernate.ddl-auto=update

# Muestra en la terminal el SQL generado por Hibernate
spring.jpa.show-sql=true

# Consola web de H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Actualiza las plantillas Thymeleaf al refrescar
spring.thymeleaf.cache=false
spring.application.name=sistema-reportes-mantenimiento

# Perfil activo: desarrollo en nuestra computadora y produccion en Render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# Puerto: 8080 en nuestra computadora o el que indique Render
server.port=${PORT:8080}

# Pagina de error personalizada
server.error.whitelabel.enabled=false

# Seguridad - Proyecto Sistema de Reportes de Mantenimiento
app.admin.password=${ADMIN_PASSWORD}
app.personal.password=${PERSONAL_PASSWORD}

# ==========================================
# PERFIL PROD: PostgreSQL en Neon
# Sistema de Reportes de Mantenimiento
# ==========================================

# Credenciales mediante variables de entorno
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Driver de PostgreSQL
spring.datasource.driver-class-name=org.postgresql.Driver

# Conserva y actualiza la estructura de la base de datos
spring.jpa.hibernate.ddl-auto=update

# No mostrar SQL en produccion
spring.jpa.show-sql=false

# Desactivar la consola H2 en produccion
spring.h2.console.enabled=false

# Limitar conexiones a Neon
spring.datasource.hikari.maximum-pool-size=5

# Reconocer HTTPS correctamente en Render
server.forward-headers-strategy=framework
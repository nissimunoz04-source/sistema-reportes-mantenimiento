
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reportes de Mantenimiento | Mi Dulce Paraíso</title>

    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>

<body class="pagina-login">

    <main class="login-contenedor">

        <!-- Encabezado con logo a la izquierda -->
        <header class="login-encabezado">

            <img
                th:src="@{/logo-colegio.png}"
                src="/logo-colegio.png"
                alt="Logo del Colegio Mi Dulce Paraíso"
                class="login-logo"
            >

            <div class="login-identidad">

                <h1>
                    Sistema de Reportes de Mantenimiento
                </h1>

                <p class="login-colegio">
                    Colegio Cristiano Mixto Bilingüe
                    Mi Dulce Paraíso
                </p>

            </div>

        </header>

        <!-- Tarjeta de inicio de sesión -->
        <section class="login-tarjeta">

            <h2>¡Bienvenido!</h2>

            <p class="login-subtitulo">
                Inicia sesión para continuar
            </p>

            <!-- Mensaje de credenciales incorrectas -->
            <div
                class="aviso error"
                role="alert"
                th:if="${param.error}"
            >
                Usuario o contraseña incorrectos.
            </div>

            <!-- Mensaje al cerrar sesión -->
            <div
                class="aviso exito"
                role="status"
                th:if="${param.salio}"
            >
                Cerraste tu sesión correctamente.
            </div>

            <!-- Formulario de Spring Security -->
            <form
                th:action="@{/login}"
                method="post"
                class="login-formulario"
            >

                <div class="campo-login">

                    <label for="username">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Escribe tu usuario"
                        autocomplete="username"
                        required
                        autofocus
                    >

                </div>

                <div class="campo-login">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Escribe tu contraseña"
                        autocomplete="current-password"
                        required
                    >

                </div>

                <button
                    type="submit"
                    class="login-boton"
                >
                    Iniciar sesión
                </button>

            </form>

        </section>

        <!-- Lema institucional -->
        <footer class="login-pie">
            ☀️ Somos Cabeza y No Cola
            <span>• Deuteronomio 28:13</span>
        </footer>

    </main>

</body>
</html>

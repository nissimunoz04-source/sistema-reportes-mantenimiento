
<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Mi Dulce Paraíso</title>

    <link rel="stylesheet" th:href="@{/estilos.css}">
</head>

<body>

    <main>

        <h1>
            Colegio Cristiano Mixto Bilingüe
            Mi Dulce Paraíso
        </h1>

        <h2>Iniciar sesión</h2>

        <!-- Mensaje cuando los datos son incorrectos -->
        <div class="aviso error"
             role="alert"
             th:if="${param.error}">

            Usuario o contraseña incorrectos.

        </div>

        <!-- Mensaje cuando se cierra sesión -->
        <div class="aviso"
             th:if="${param.salio}">

            Cerraste tu sesión correctamente.

        </div>

        <!-- Formulario de inicio de sesión -->
        <form th:action="@{/login}" method="post">

            <label for="username">
                Usuario
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Escribe tu usuario"
                autocomplete="username"
                required
                autofocus
            >

            <label for="password">
                Contraseña
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Escribe tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                Iniciar sesión
            </button>

        </form>

    </main>

</body>
</html>
